$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend
# DP-1 comes back from suspend in SDR while Hyprland keeps driving the PQ transfer
# function, which reads as washed-out grey. Nothing re-sends the HDR metadata as
# long as the preset is unchanged, so drop it and apply the monitors again.
# Re-running just that file rather than `hyprctl reload` keeps the workspace rules
# custom/keybinds.lua creates at runtime, monocle among them.
$hdr_recover_cmd = hyprctl eval 'hl.monitor({ output = "DP-1", cm = "srgb" })' && hyprctl eval 'dofile(os.getenv("HOME") .. "/.config/hypr/settings.lua")'

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'; sleep 2; $hdr_recover_cmd
    inhibit_sleep = 3
}

listener {
    timeout = 1800 # 30mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 2100 # 35mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 2700 # 45mins
    on-timeout = $suspend_cmd
}
